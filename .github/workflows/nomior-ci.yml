# Fork-specific CI: fork-manifest diff-budget check, secret scan, and the
# standard install/typecheck/lint/test pipeline on plain GitHub runners with
# Node 24 + pnpm 11 via corepack. Upstream's ci.yml (and the other upstream
# workflows targeting blacksmith-* runners the fork does not have) are gated
# to `github.repository == 'pingdotgg/t3code'`, so this workflow is the only
# CI that runs here and the one the sync pipeline relies on.
name: Nomior CI

on:
  pull_request:
  push:
    branches:
      - main
      - "sync/**"
  # Re-running the suite without a commit: after a billing or runner outage,
  # and to check a sync PR that arrived with its checks suppressed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nomior-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPSTREAM_REPO: https://github.com/pingdotgg/t3code.git

jobs:
  secret_scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream --no-tags '+refs/heads/main:refs/remotes/upstream/main'

      # Repo history must stay publishable (PLAN.md: public-grade history
      # hygiene). The gitleaks CLI is MIT and needs no key; only the action
      # wrapper requires GITLEAKS_LICENSE for org-owned repos, public ones
      # included, so the job runs the binary and depends on no secret.
      #
      # Scope is our own commits — everything not already reachable from
      # upstream. Upstream's history is published at pingdotgg/t3code, so its
      # twelve test-fixture hits are neither ours to fix nor a disclosure, and
      # failing on them would only teach us to stop reading this job.
      # Allowlists live in .gitleaks.toml.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --redact --no-banner --verbose \
            --log-opts="HEAD --not --remotes=upstream"

  fork_manifest:
    name: Fork Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream --no-tags '+refs/heads/main:refs/remotes/upstream/main'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup pnpm via corepack
        run: corepack enable

      - name: Install manifest-check dependencies
        run: pnpm install --frozen-lockfile --filter @t3tools/scripts...

      - name: Check fork manifest
        run: pnpm nomior:check-manifest

  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup pnpm via corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup pnpm via corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron runtime is installed
        run: pnpm exec vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        run: pnpm exec vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' test

  # apps/server pins fileParallelism: false; sharding mirrors upstream ci.yml
  # so no two server test files share a machine.
  test_server:
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup pnpm via corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm exec vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}
